<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>valheim modlist</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1E1F21;
            color: #969896;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .links-block {
            line-height: 1.6;
            white-space: pre-line;
        }
        .links-block a {
            color: #969896;
            text-decoration: none;
        }
        .links-block a:hover {
            color: #C5C8C6;
            text-decoration: underline;
        }
        .title-row {
            display: flex;
            align-items: center;
            gap: 1.0em;
        }
        .copy-btn {
            background: none;
            border: none;
            color: #969896;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            font: inherit;
            font-size: 2em;
        }
        .copy-btn:hover {
            color:
            #C5C8C6;
        }
        .copy-btn:active {
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div>
        <div class="title-row">
            <h1>valheim modlist</h1>
            <button class="copy-btn" id="copy-btn" title="copy modlist">
                ⧉
            </button>
        </div>
    </div>
    <div class="links-block" id="links-block"></div>
    <script>
        document.getElementById("copy-btn").addEventListener("click", function () {
            const urls = [...document.querySelectorAll("#links-block a")].map(a => a.href);
            navigator.clipboard.writeText(urls.join("\n"));
        });

        const container = document.getElementById("links-block");
        fetch("mods.txt")
            .then(res => res.text())
            .then(text => {
                text.trim().split("\n").forEach(url => {
                    if (!url.trim()) return;
                    const link = document.createElement("a");
                    link.href = url.trim();
                    link.textContent = url.trim();
                    link.target = "_blank";
                    container.appendChild(link);
                    container.appendChild(document.createElement("br"));
                });
            });
    </script>
</body>
</html>
